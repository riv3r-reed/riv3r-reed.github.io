<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wei</title>
    <style>
        :root {
            --bg: #f6f3ee;
            --text: #111111;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
            position: relative;
        }

        .page {
            max-width: 760px;
            width: calc(100% - 120px);
            margin: 0 auto;
            padding: 72px 0 48px;
            text-align: left;
            position: relative;
        }

        .mark {
            position: absolute;
            top: 26px;
            left: max(26px, calc((100vw - 760px) / 2 - 12px));
            font-size: clamp(10rem, 25vw, 40rem);
            line-height: 1;
            font-weight: 500;
            color: rgba(160, 159, 159, 0.28);
            letter-spacing: 0.02em;
            pointer-events: none;
            user-select: none;
        }

        h1 {
            margin: 0;
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 500;
            line-height: 0.9;
            letter-spacing: -0.06em;
        }

        .subtitle {
            margin: 0.5rem 0 2rem;
            font-size: 1.1rem;
            letter-spacing: 0.04em;
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.15rem;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            font-size: clamp(1.8rem, 3vw, 2.9rem);
            line-height: 1.2;
            letter-spacing: -0.04em;
        }

        nav a:hover,
        nav a:focus {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="mark" aria-hidden="true">葦</div>
    <main class="page">
        <h1>Wei</h1>
        <p class="subtitle">a reed by any other name:何一苇, 池, 電子露, Yiwei, River, Ashi</p>

        <nav aria-label="Main navigation">
            <a href="reedme.html">REEDME</a>
            <a href="works.html">works</a>
            <a href="writings.html">writings</a>
            <a href="echoes.html">echoes</a>
        </nav>
    </main>
</body>
</html>
